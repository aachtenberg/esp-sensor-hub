; PlatformIO Project Configuration File
; ESP32-S3 Solar Monitor - Victron SmartShunt + MPPT monitoring
; Target board: Freenove ESP32-S3-WROOM (compatible with esp32-s3-devkitc-1)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Library dependencies
; EspSoftwareSerial removed — all three VE.Direct inputs now use hardware UARTs
; (see ARDUINO_USB_CDC_ON_BOOT note below).
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8.0
    https://github.com/tzapu/WiFiManager.git
    https://github.com/khoih-prog/ESP_DoubleResetDetector.git
    olikraus/U8g2 @ ^2.35.9

; Build flags
; ARDUINO_USB_CDC_ON_BOOT=1 routes Serial to the native USB-Serial/JTAG controller
; (GPIO 19/20), which FREES UART0 (GPIO 43/44) for the third VE.Direct input. That
; lets MPPT2 move off the bit-banged EspSoftwareSerial (a GPIO-ISR WiFi antagonist
; blamed for the overnight stack wedges) onto hardware UART0. Trade-off: the runtime
; console is now on the native USB port; the CH343 UART port only shows ROM boot
; messages. Flashing over CH343 still works (the ROM bootloader always uses UART0).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1

; Upload settings
; Flashing still works over the CH343 UART port (ROM bootloader uses UART0 regardless
; of the CDC setting). The runtime serial monitor is now on the native USB port.
; Primary deploy path is OTA (see [env:ota]).
upload_speed = 921600

; -----------------------------------------------------------------------------
; OTA env — inherits everything from the base env and overrides the upload path.
; Usage:   OTA_PASSWORD=<pw> pio run -e ota -t upload --upload-port <device-ip>
; (or set upload_port below to pin it to a fixed IP / .local hostname)
; -----------------------------------------------------------------------------
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.0.85
; --host_port pins the port the ESP connects BACK to during transfer. espota
; otherwise randomizes it, so the inbound connection gets blocked by Windows
; Firewall under WSL2 mirrored networking. 8266 matches the existing inbound
; allow rule ("ESP OTA Inbound", TCP 8266), so no new firewall rule is needed.
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    --host_port=8266
